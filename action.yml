name: "Watch SQL Queries"
description: "This action watches traffic to the database to record what SQL queries are executed."
inputs:
  SQL_PROXY_API_ADDRESS:
    description: "The port on which the sql proxy api is running"
    required: true
  DEFAULT_DATABASE:
    description: "The default database to use"
    required: true
  GITHUB_REPOSITORY:
    description: "The github repository to use"
    required: true
  GITHUB_TOKEN:
    description: "The github token to use"
    required: true
  TEST_SUITE_NAME:
    description: "The name of the test suite being run (used for unique artifact names)"
    required: false
    default: "default"
outputs:
  sql-queries:
    description: "A list of all the sql queries executed."
    value: ${{ steps.get-sql-data.outputs.sql-queries }}
  queries-diff:
    description: "A diff of SQL executed"
    value: ${{ steps.get-sql-data.outputs.queries-diff }}
  schema:
    description: "The full schema of the database"
    value: ${{ steps.get-sql-data.outputs.schema }}
  schema-diff:
    description: "A diff of the database schema"
    value: ${{ steps.get-sql-data.outputs.schema-diff }}
runs:
  using: "composite"
  steps:
    - name: Checkout recon
      uses: actions/checkout@v4
      with:
        repository: droptableifexists/recon
        ref: main
        path: recon

    - name: Run recon
      id: get-sql-data
      shell: bash
      env:
        SQL_PROXY_API_ADDRESS: ${{ inputs.SQL_PROXY_API_ADDRESS }}
        DEFAULT_DATABASE: ${{ inputs.DEFAULT_DATABASE }}
        GITHUB_REPOSITORY: ${{ inputs.GITHUB_REPOSITORY }}
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        TEST_SUITE_NAME: ${{ inputs.TEST_SUITE_NAME }}
      run: |
        chmod +x ./recon/recon
        ./recon/recon

    - name: Upload SQL queries
      uses: actions/upload-artifact@v4
      with:
        name: sql-queries-${{ inputs.TEST_SUITE_NAME }}
        path: sql-queries.json
        retention-days: 30
        overwrite: true

    - name: Upload queries diff
      uses: actions/upload-artifact@v4
      with:
        name: queries-diff-${{ inputs.TEST_SUITE_NAME }}
        path: queries-diff.json
        retention-days: 30
        overwrite: true

    - name: Upload full schema
      uses: actions/upload-artifact@v4
      with:
        name: full-schema-${{ inputs.TEST_SUITE_NAME }}
        path: full-schema.json
        retention-days: 30
        overwrite: true

    - name: Upload schema diff
      uses: actions/upload-artifact@v4
      with:
        name: schema-diff-${{ inputs.TEST_SUITE_NAME }}
        path: schema-diff.json
        retention-days: 30
        overwrite: true

