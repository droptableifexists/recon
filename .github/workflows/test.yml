name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/sql-proxy:latest
          docker build -t $IMAGE_NAME ./sql-proxy
          docker push $IMAGE_NAME

  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      actions: read  # <-- Needed for getArtifactFromMain() to list artifacts

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      proxy:
        image: ghcr.io/${{ github.repository_owner }}/sql-proxy:latest
        env:
          LISTEN_PORT: 5433
          BACKEND_HOST: postgres
          BACKEND_PORT: 5432
          API_PORT: 8080
        ports:
          - 5433:5433
          - 8080:8080

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Migrate Database
        run: |
          cd schema_test
          go run .

      - name: Run Tests
        run: |
          cd tests
          go run .

      - name: Get SQL data
        uses: ./
        id: get-sql-data
        with:
          SQL_PROXY_API_ADDRESS: localhost:8080
          DB_CONNECTION_STRING: host=localhost port=5432 user=postgres password=postgres sslmode=disable
          DEFAULT_DATABASE: postgres
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sql-analysis-artifacts
          path: artifacts/
          retention-days: 30
