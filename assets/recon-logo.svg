<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>recon logo</title>
  <desc>A stylized database with a magnifying glass, representing query and schema inspection.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#122b45"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36d1dc"/>
      <stop offset="100%" stop-color="#5b86e5"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="28" fill="url(#bgGrad)"/>

  <!-- Database (cylinder) -->
  <!-- Top ellipse -->
  <ellipse cx="200" cy="180" rx="110" ry="28" fill="url(#accentGrad)" opacity="0.9"/>
  <!-- Body -->
  <rect x="90" y="180" width="220" height="160" fill="url(#accentGrad)" opacity="0.85"/>
  <!-- Middle ellipse (front rim) -->
  <ellipse cx="200" cy="180" rx="110" ry="28" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  <!-- Separator ellipses to imply stacked pages -->
  <ellipse cx="200" cy="240" rx="108" ry="26" fill="#ffffff" opacity="0.08"/>
  <ellipse cx="200" cy="300" rx="106" ry="24" fill="#ffffff" opacity="0.06"/>
  <!-- Bottom ellipse (shadow) -->
  <ellipse cx="200" cy="340" rx="110" ry="28" fill="#000000" opacity="0.15"/>

  <!-- Magnifying glass over the database -->
  <circle cx="340" cy="300" r="70" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="8"/>
  <!-- Handle -->
  <line x1="388" y1="348" x2="438" y2="398" stroke="#ffffff" stroke-opacity="0.9" stroke-width="12" stroke-linecap="round"/>

  <!-- Subtle crosshair inside the lens -->
  <line x1="340" y1="250" x2="340" y2="350" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
  <line x1="290" y1="300" x2="390" y2="300" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>

  <!-- Accent ring inside lens -->
  <circle cx="340" cy="300" r="46" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.9"/>

  <!-- Wordmark (optional; relies on system font fallback) -->
  <text x="256" y="456" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="28" fill="#e6f1ff" opacity="0.9">recon</text>
</svg> 